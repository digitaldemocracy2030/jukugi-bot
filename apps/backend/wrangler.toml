name = "my-worker"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[queues.producers]]
binding = "SUMMARY_QUEUE"
queue = "summary-generation"

[[queues.consumers]]
queue = "summary-generation"
max_batch_size = 1
max_retries = 2

[[r2_buckets]]
binding = "RECORDINGS_BUCKET"
bucket_name = "recordings"
preview_bucket_name = "recordings-dev"

[[d1_databases]]
binding = "DB"
database_name = "my-database"
database_id = "local"
migrations_dir = "migrations"
