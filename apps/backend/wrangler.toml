name = "my-worker"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
LIVEKIT_URL = "wss://test-hun8gv88.livekit.cloud"
ADMIN_API_KEY = ""
LIVEKIT_API_KEY = ""
LIVEKIT_API_SECRET = ""
# Cloudflare R2 storage — credentials for LiveKit Egress (recording disabled if STORAGE_ENDPOINT is absent)
STORAGE_ENDPOINT = ""
STORAGE_ACCESS_KEY = ""
STORAGE_SECRET_KEY = ""
STORAGE_PUBLIC_URL = ""
# LiveKit webhook secret (defaults to LIVEKIT_API_SECRET if omitted)
LIVEKIT_WEBHOOK_SECRET = ""
# Transcription agent name (dispatch disabled if absent)
TRANSCRIPTION_AGENT_NAME = ""

[[r2_buckets]]
binding = "RECORDINGS_BUCKET"
bucket_name = "recordings"
preview_bucket_name = "recordings-dev"

[[d1_databases]]
binding = "DB"
database_name = "my-database"
database_id = "local"
migrations_dir = "migrations"
