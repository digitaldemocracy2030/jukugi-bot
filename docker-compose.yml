services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    container_name: my-app-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/app:/app/apps/frontend/app:ro
      - ./apps/frontend/public:/app/apps/frontend/public:ro
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8787}
      - VITE_LIVEKIT_URL=${VITE_LIVEKIT_URL:-ws://localhost:7880}
    stdin_open: true
    tty: true
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: my-app-backend
    ports:
      - "8787:8787"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src:ro
      - backend_wrangler:/app/apps/backend/.wrangler
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-http://livekit-server:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_WEBHOOK_SECRET=${LIVEKIT_WEBHOOK_SECRET:-secret}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-my-local-admin-key-12345}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-http://minio:9000}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-http://localhost:9000}
      - TRANSCRIPTION_AGENT_NAME=${TRANSCRIPTION_AGENT_NAME:-transcription-agent}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL_LARGE=${AI_MODEL_LARGE:-gpt-4o}
      - AI_MODEL_MEDIUM=${AI_MODEL_MEDIUM:-gpt-4o-mini}
      - AI_MODEL_SMALL=${AI_MODEL_SMALL:-gpt-4o-mini}
    depends_on:
      livekit-server:
        condition: service_started
    stdin_open: true
    tty: true
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: my-app-redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: my-app-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50060:50000-50060/udp"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat > /tmp/livekit.yaml <<'YAML'
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50060
          use_external_ip: false
        redis:
          address: redis:6379
        keys:
          devkey: secret
        webhook:
          urls:
            - http://backend:8787/api/webhooks/livekit
          api_key: devkey
        logging:
          level: info
        YAML
        IP=$$(hostname -i | awk '{print $$1}')
        exec /livekit-server --config /tmp/livekit.yaml --node-ip $$IP
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  egress:
    image: livekit/egress:latest
    container_name: my-app-egress
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: debug
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit-server:7880
        insecure: true
        redis:
          address: redis:6379
        s3:
          access_key: minioadmin
          secret: minioadmin
          endpoint: http://minio:9000
          region: us-east-1
          bucket: recordings
          force_path_style: true
    depends_on:
      livekit-server:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: my-app-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  createbuckets:
    image: minio/mc
    container_name: my-app-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set myminio http://minio:9000 minioadmin minioadmin
        mc mb myminio/recordings --ignore-existing
        mc anonymous set download myminio/recordings
        echo "Bucket 'recordings' created and configured."
    networks:
      - app-network

  transcription-agent:
    build:
      context: .
      dockerfile: apps/transcription-agent/Dockerfile
    container_name: my-app-transcription-agent
    profiles:
      - transcription
    volumes:
      - ./apps/transcription-agent/src:/app/apps/transcription-agent/src:ro
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-http://livekit-server:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-my-local-admin-key-12345}
      - BACKEND_URL=http://backend:8787
    depends_on:
      livekit-server:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend_wrangler:
  minio_data:
